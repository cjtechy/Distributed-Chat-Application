name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write production config
        env:
          API_BASE: ${{ vars.API_BASE }}
          WS_BASE: ${{ vars.WS_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::warning::API_BASE repo variable is not set. Using placeholder — set it under Settings → Secrets and variables → Actions → Variables."
            API_BASE="https://api.yourdomain.com/v1"
          fi
          if [ -z "$WS_BASE" ]; then
            echo "::warning::WS_BASE repo variable is not set. Using placeholder — set it under Settings → Secrets and variables → Actions → Variables."
            WS_BASE="wss://ws.yourdomain.com/v1"
          fi
          cat > frontend/config.js <<EOF
          window.APP_CONFIG = {
            API_BASE: "${API_BASE}",
            WS_BASE: "${WS_BASE}",
          };
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
