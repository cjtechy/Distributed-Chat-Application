<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notifications — Settings</title>
  <link rel="stylesheet" href="/assets/console.css?v=layout">
</head>
<body>
  <div class="console-app">
    <nav class="console-nav" id="console-nav">
      <a class="console-brand" href="/console"><span class="console-brand-mark" aria-hidden="true">💬</span> Chat</a>
      <div class="console-links">
        <a href="/console" data-nav="/console">Chats</a>
        <a href="/console/group" data-nav="/console/group">Groups</a>
        <a href="/console/direct" data-nav="/console/direct">Direct</a>
        <a href="/console/settings" data-nav="/console/settings">Settings</a>
      </div>
      <div class="console-user">
        <span class="console-user-name" id="console-username">…</span>
        <div class="console-user-actions">
          <button class="btn-ghost" id="console-logout" type="button">Log out</button>
        </div>
      </div>
    </nav>
    <main class="console-main">
      <div class="wa-inbox settings-screen">
        <header class="settings-top">
          <a class="wa-icon-btn" href="/console/settings" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></a>
          <h1>Notifications</h1>
        </header>
        <div class="settings-list" id="notify-prefs">
          <button class="settings-item settings-toggle" type="button" data-notify="messageSound">
            <span class="settings-copy"><b>Message sounds</b><small>Play a tone for new messages in groups and direct chats</small></span>
            <span class="settings-switch" aria-hidden="true"><span></span></span>
          </button>
          <button class="settings-item settings-toggle" type="button" data-notify="messageWhileTyping">
            <span class="settings-copy"><b>While typing</b><small>Still play message sounds when you are writing</small></span>
            <span class="settings-switch" aria-hidden="true"><span></span></span>
          </button>
          <button class="settings-item settings-toggle" type="button" data-notify="typingSound">
            <span class="settings-copy"><b>Typing sounds</b><small>Click when you type in a chat</small></span>
            <span class="settings-switch" aria-hidden="true"><span></span></span>
          </button>
          <button class="settings-item settings-toggle" type="button" data-notify="voiceSound">
            <span class="settings-copy"><b>Voice recording</b><small>Beep when you start or stop the microphone</small></span>
            <span class="settings-switch" aria-hidden="true"><span></span></span>
          </button>
          <button class="settings-item settings-toggle" type="button" data-notify="callSound">
            <span class="settings-copy"><b>Call ringtone</b><small>Ring for incoming and outgoing calls</small></span>
            <span class="settings-switch" aria-hidden="true"><span></span></span>
          </button>
          <button class="settings-item settings-toggle" type="button" data-notify="vibrate">
            <span class="settings-copy"><b>Vibrate</b><small>Haptic pulse with messages and recording</small></span>
            <span class="settings-switch" aria-hidden="true"><span></span></span>
          </button>
        </div>
      </div>
    </main>
  </div>
  <script src="/config.js"></script>
  <script src="/scripts/http.js"></script>
  <script src="/scripts/call.js?v=layout"></script>
  <script src="/scripts/console.js?v=layout"></script>
</body>
</html>
