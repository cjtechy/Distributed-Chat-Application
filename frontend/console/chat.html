<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chat — Distributed Chat</title>
  <link rel="stylesheet" href="/assets/console.css?v=inbox">
  <link rel="stylesheet" href="/assets/chat.css?v=room-boot">
</head>
<body class="console-chat">
  <button class="btn-ghost console-menu" id="console-menu" type="button" aria-label="Open menu">Menu</button>
  <div class="console-app">
    <nav class="console-nav" id="console-nav">
      <a class="console-brand" href="/console">
        <span class="console-brand-mark" aria-hidden="true">💬</span>
        Distributed Chat
      </a>
      <div class="console-links">
        <a href="/console">Dashboard</a>
        <a href="/console/chat">Chat</a>
        <a href="/console/group">Groups</a>
        <a href="/console/direct">Direct</a>
        <a href="/console/settings">Settings</a>
      </div>
      <div class="console-user">
        <span class="console-user-name" id="console-username">…</span>
        <div class="console-user-actions">
          <a class="btn-ghost" id="console-admin" href="/admin" hidden>Admin</a>
          <a class="btn-ghost" href="/">Home</a>
          <button class="btn-ghost" id="console-logout" type="button">Log out</button>
        </div>
      </div>
    </nav>
    <main class="console-main">
  <div class="app">
    <section id="chat-panel" class="chat-panel active">
      <aside class="chat-sidebar">
        <div class="sidebar-header">
          <span class="tag" id="group-tag">Group</span>
          <h2 id="group-name">…</h2>
          <p id="group-blurb">Loading this room…</p>
        </div>
        <div class="sidebar-section">
          <h3>Members online</h3>
          <ul id="online-list" class="online-list"></ul>
        </div>
      </aside>

      <div class="chat-main">
        <header class="chat-header">
          <div class="avatar" id="user-avatar">?</div>
          <div class="header-info">
            <h2 id="group-heading">…</h2>
            <p id="status">Connecting...</p>
          </div>
        </header>

        <div id="messages" class="chat-body"></div>

        <footer class="chat-footer">
          <div id="typing-indicator"></div>
          <form id="chat-form">
            <input id="message" type="text" placeholder="Share something with the community" autocomplete="off" maxlength="4000">
            <button id="send" class="btn-send" type="submit" aria-label="Send">➤</button>
          </form>
        </footer>
      </div>
    </section>
  </div>
    </main>
  </div>

  <script src="/config.js"></script>
  <script src="/scripts/console.js"></script>
  <script src="/scripts/chat.js?v=room-boot"></script>

</body>
</html>
