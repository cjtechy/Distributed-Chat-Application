<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chat — Distributed Chat</title>
  <link rel="stylesheet" href="/assets/console.css?v=phone">
  <link rel="stylesheet" href="/assets/chat.css?v=phone">
</head>
<body class="console-chat">
  <div class="console-app">
    <nav class="console-nav" id="console-nav">
      <a class="console-brand" href="/console">
        <span class="console-brand-mark" aria-hidden="true">💬</span>
        Chat
      </a>
      <div class="console-links">
        <a href="/console" data-nav="/console">Chats</a>
        <a href="/console/group" data-nav="/console/group">Groups</a>
        <a href="/console/direct" data-nav="/console/direct">Direct</a>
        <a href="/console/settings" data-nav="/console/settings">Settings</a>
      </div>
      <div class="console-user">
        <span class="console-user-name" id="console-username">…</span>
        <div class="console-user-actions">
          <a class="btn-ghost" id="console-admin" href="/admin" hidden>Admin</a>
          <button class="btn-ghost" id="console-logout" type="button">Log out</button>
        </div>
      </div>
    </nav>
    <main class="console-main">
      <div class="app">
        <section id="chat-panel" class="chat-panel active">
          <aside class="chat-sidebar">
            <div class="sidebar-header">
              <span class="tag" id="group-tag">Group</span>
              <h2 id="group-name">…</h2>
              <p id="group-blurb">Loading this room…</p>
            </div>
            <div class="sidebar-section">
              <h3>Members online</h3>
              <ul id="online-list" class="online-list">
                <li class="sk-online" aria-hidden="true"><span class="sk-bone sk-dot"></span><span class="sk-bone sk-name"></span></li>
                <li class="sk-online" aria-hidden="true"><span class="sk-bone sk-dot"></span><span class="sk-bone sk-name"></span></li>
                <li class="sk-online" aria-hidden="true"><span class="sk-bone sk-dot"></span><span class="sk-bone sk-name"></span></li>
              </ul>
            </div>
          </aside>

          <div class="chat-main">
            <header class="chat-header is-loading" id="chat-header">
              <a class="header-back" href="/console" aria-label="Back to chats">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
              </a>
              <div class="avatar" id="user-avatar" aria-hidden="true">?</div>
              <div class="header-info">
                <h2 id="group-heading">…</h2>
                <div id="connection-status" class="connection-status" data-state="connecting" role="status" aria-live="polite">
                  <span class="connection-status-indicator" aria-hidden="true"></span>
                  <span id="status">Connecting…</span>
                </div>
              </div>
              <div class="header-actions">
                <button id="video-call-btn" class="btn-icon" type="button" aria-label="Video call" disabled>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                </button>
                <button id="audio-call-btn" class="btn-icon" type="button" aria-label="Voice call" disabled>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92V21a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 5.18 2 2 0 0 1 4.11 3h4.09a2 2 0 0 1 2 1.72c.12.9.32 1.77.59 2.61a2 2 0 0 1-.45 2.11L9.09 10.91a16 16 0 0 0 6 6l1.47-1.25a2 2 0 0 1 2.11-.45c.84.27 1.71.47 2.61.59A2 2 0 0 1 22 16.92z"/></svg>
                </button>
                <a class="btn-icon" href="/console/settings" aria-label="More">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
                </a>
              </div>
            </header>

            <div class="chat-body-wrap">
              <div id="messages-empty" class="chat-empty is-hidden">
                <div class="chat-empty-icon" aria-hidden="true">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <p class="chat-empty-title">No messages yet</p>
                <span class="chat-empty-sub">Say hello to start the conversation.</span>
              </div>
              <div id="messages-skeleton" class="chat-skeleton" aria-hidden="true">
                <div class="sk-bone sk-bubble in w-sm"></div>
                <div class="sk-bone sk-bubble in w-md"></div>
                <div class="sk-bone sk-bubble out w-md"></div>
                <div class="sk-bone sk-bubble out w-lg"></div>
                <div class="sk-bone sk-bubble in w-lg"></div>
                <div class="sk-bone sk-bubble out w-sm"></div>
                <div class="sk-bone sk-bubble in w-md"></div>
                <div class="sk-bone sk-bubble out w-md"></div>
              </div>
              <div id="messages" class="chat-body">
                <div id="messages-list" class="messages-list"></div>
                <div id="messages-anchor" class="messages-anchor" aria-hidden="true"></div>
              </div>
              <button id="scroll-bottom-btn" class="scroll-bottom-btn" type="button" aria-label="Jump to latest messages" hidden>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                <span id="scroll-bottom-count" class="scroll-bottom-count" hidden></span>
              </button>
            </div>

            <footer class="chat-footer">
              <div id="typing-indicator"></div>
              <form id="chat-form" class="compose-bar">
                <button class="btn-icon btn-camera" type="button" tabindex="-1" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
                <div class="compose-field">
                  <input id="message" type="text" placeholder="Type a message" autocomplete="off" maxlength="4000">
                  <button class="btn-icon btn-attach" type="button" tabindex="-1" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                  </button>
                </div>
                <button id="voice-btn" class="btn-icon btn-voice" type="button" aria-label="Record voice message" aria-pressed="false">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                <button id="send" class="btn-icon btn-send" type="submit" aria-label="Send" hidden>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </form>
            </footer>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="call-overlay" class="call-overlay" hidden>
    <div id="call-ring" class="call-ring" hidden>
      <div class="call-ring-glow" aria-hidden="true"></div>
      <div id="call-ring-avatar" class="call-ring-avatar">?</div>
      <h2 id="call-ring-name">Calling…</h2>
      <p id="call-ring-status">Ringing</p>
      <div class="call-ring-actions">
        <button id="call-reject" class="call-btn call-btn-reject" type="button">Decline</button>
        <button id="call-cancel" class="call-btn call-btn-reject" type="button" hidden>Cancel</button>
        <button id="call-accept" class="call-btn call-btn-accept" type="button">Accept</button>
      </div>
    </div>
    <div id="call-active" class="call-active" hidden>
      <div id="call-remotes" class="call-remotes"></div>
      <video id="call-local" class="call-local" autoplay playsinline muted hidden></video>
      <div class="call-active-meta">
        <strong id="call-title">Call</strong>
        <span id="call-status">Connecting…</span>
      </div>
      <div class="call-controls">
        <button id="call-mute" class="call-ctrl" type="button" aria-label="Mute">Mic</button>
        <button id="call-camera" class="call-ctrl" type="button" aria-label="Camera">Cam</button>
        <button id="call-hangup" class="call-ctrl call-ctrl-end" type="button" aria-label="End call">End</button>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/scripts/http.js"></script>
  <script src="/scripts/call.js?v=glare"></script>
  <script src="/scripts/console.js?v=phone"></script>
  <script src="/scripts/chat.js?v=phone"></script>
</body>
</html>
