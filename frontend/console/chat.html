<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chat — Distributed Chat</title>
  <link rel="stylesheet" href="/assets/console.css?v=layout">
  <link rel="stylesheet" href="/assets/chat.css?v=layout">
</head>
<body class="console-chat">
  <div class="console-app">
    <nav class="console-nav" id="console-nav">
      <a class="console-brand" href="/console">
        <span class="console-brand-mark" aria-hidden="true">C</span>
        <span>Chat</span>
      </a>
      <div class="console-links">
        <a href="/console" data-nav="/console" aria-label="Chats">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Chats</span>
        </a>
        <a href="/console/group" data-nav="/console/group" aria-label="Groups">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.85"/><path d="M15.5 3.2a4 4 0 0 1 0 7.6"/></svg>
          <span>Groups</span>
        </a>
        <a href="/console/direct" data-nav="/console/direct" aria-label="Direct messages">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Direct</span>
        </a>
        <a href="/console/settings" data-nav="/console/settings" aria-label="Settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Settings</span>
        </a>
      </div>
      <div class="console-user">
        <span class="rail-avatar" id="rail-avatar" aria-hidden="true">?</span>
        <span class="console-user-name" id="console-username">…</span>
        <div class="console-user-actions">
          <button class="btn-ghost" id="console-logout" type="button" aria-label="Log out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            <span>Log out</span>
          </button>
        </div>
      </div>
    </nav>
    <main class="console-main">
      <div class="app">
        <section id="chat-panel" class="chat-panel active">
          <aside class="chat-sidebar">
            <div class="chat-inbox-head">
              <h1>Chats</h1>
              <div class="chat-inbox-actions">
                <a class="wa-icon-btn" href="/console/direct" aria-label="New chat">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </a>
                <div class="wa-more">
                  <button class="wa-icon-btn" id="inbox-more-btn" type="button" aria-label="More" aria-expanded="false" aria-haspopup="true">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
                  </button>
                  <div class="wa-more-menu" id="inbox-more-menu" hidden>
                    <a href="/console/group">New group</a>
                    <a href="/console/direct">New chat</a>
                    <a href="/console/settings">Settings</a>
                  </div>
                </div>
              </div>
            </div>
            <label class="wa-search open" id="inbox-search-wrap">
              <span class="wa-search-mark" aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              </span>
              <input id="inbox-search" type="search" placeholder="Search or start a new chat" autocomplete="off">
            </label>
            <div class="wa-chips" role="tablist" aria-label="Filter chats">
              <button class="wa-chip" type="button" data-filter="all" aria-pressed="true">All</button>
              <button class="wa-chip" type="button" data-filter="unread" aria-pressed="false">Unread</button>
              <button class="wa-chip" type="button" data-filter="groups" aria-pressed="false">Groups</button>
            </div>
            <div id="inbox-list" class="wa-thread-list" aria-busy="true" aria-label="Loading chats">
              <div class="sk-thread" aria-hidden="true"><span class="sk-bone sk-avatar"></span><div class="sk-lines"><span class="sk-bone sk-name"></span><span class="sk-bone sk-snip"></span></div><span class="sk-bone sk-time"></span></div>
              <div class="sk-thread" aria-hidden="true"><span class="sk-bone sk-avatar"></span><div class="sk-lines"><span class="sk-bone sk-name"></span><span class="sk-bone sk-snip"></span></div><span class="sk-bone sk-time"></span></div>
              <div class="sk-thread" aria-hidden="true"><span class="sk-bone sk-avatar"></span><div class="sk-lines"><span class="sk-bone sk-name"></span><span class="sk-bone sk-snip"></span></div><span class="sk-bone sk-time"></span></div>
              <div class="sk-thread" aria-hidden="true"><span class="sk-bone sk-avatar"></span><div class="sk-lines"><span class="sk-bone sk-name"></span><span class="sk-bone sk-snip"></span></div><span class="sk-bone sk-time"></span></div>
              <div class="sk-thread" aria-hidden="true"><span class="sk-bone sk-avatar"></span><div class="sk-lines"><span class="sk-bone sk-name"></span><span class="sk-bone sk-snip"></span></div><span class="sk-bone sk-time"></span></div>
            </div>
            <div class="chat-room-meta" hidden>
              <span class="tag" id="group-tag">Group</span>
              <h2 id="group-name">…</h2>
              <p id="group-blurb">Loading this room…</p>
              <ul id="online-list" class="online-list"></ul>
            </div>
          </aside>

          <div class="chat-main">
            <header class="chat-header is-loading" id="chat-header">
              <a class="header-back" href="/console" aria-label="Back to chats">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
              </a>
              <div class="avatar" id="user-avatar" aria-hidden="true">?</div>
              <div class="header-info">
                <h2 id="group-heading">…</h2>
                <div id="connection-status" class="connection-status" data-state="connecting" role="status" aria-live="polite">
                  <span class="connection-status-indicator" aria-hidden="true"></span>
                  <span id="status">Connecting…</span>
                </div>
              </div>
              <div class="header-actions">
                <button id="video-call-btn" class="btn-icon" type="button" aria-label="Video call" disabled>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                </button>
                <button id="audio-call-btn" class="btn-icon" type="button" aria-label="Voice call" disabled>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92V21a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 5.18 2 2 0 0 1 4.11 3h4.09a2 2 0 0 1 2 1.72c.12.9.32 1.77.59 2.61a2 2 0 0 1-.45 2.11L9.09 10.91a16 16 0 0 0 6 6l1.47-1.25a2 2 0 0 1 2.11-.45c.84.27 1.71.47 2.61.59A2 2 0 0 1 22 16.92z"/></svg>
                </button>
                <a class="btn-icon" href="/console/settings" aria-label="More">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
                </a>
              </div>
            </header>

            <div class="chat-body-wrap">
              <div id="messages-empty" class="chat-empty is-hidden">
                <div class="chat-empty-icon" aria-hidden="true">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <p class="chat-empty-title">No messages yet</p>
                <span class="chat-empty-sub">Say hello to start the conversation.</span>
              </div>
              <div id="messages-skeleton" class="chat-skeleton" aria-hidden="true">
                <div class="sk-bone sk-bubble in w-sm"></div>
                <div class="sk-bone sk-bubble in w-md"></div>
                <div class="sk-bone sk-bubble out w-md"></div>
                <div class="sk-bone sk-bubble out w-lg"></div>
                <div class="sk-bone sk-bubble in w-lg"></div>
                <div class="sk-bone sk-bubble out w-sm"></div>
                <div class="sk-bone sk-bubble in w-md"></div>
                <div class="sk-bone sk-bubble out w-md"></div>
              </div>
              <div id="messages" class="chat-body">
                <div id="messages-list" class="messages-list"></div>
                <div id="messages-anchor" class="messages-anchor" aria-hidden="true"></div>
              </div>
              <button id="scroll-bottom-btn" class="scroll-bottom-btn" type="button" aria-label="Jump to latest messages" hidden>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                <span id="scroll-bottom-count" class="scroll-bottom-count" hidden></span>
              </button>
            </div>

            <footer class="chat-footer">
              <div id="typing-indicator"></div>
              <form id="chat-form" class="compose-bar">
                <button class="btn-icon btn-camera" type="button" tabindex="-1" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
                <div class="compose-field">
                  <input id="message" type="text" placeholder="Type a message" autocomplete="off" maxlength="4000">
                  <button class="btn-icon btn-attach" type="button" tabindex="-1" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                  </button>
                </div>
                <button id="voice-btn" class="btn-icon btn-voice" type="button" aria-label="Record voice message" aria-pressed="false">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                <button id="send" class="btn-icon btn-send" type="submit" aria-label="Send" hidden>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </form>
            </footer>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="call-overlay" class="call-overlay" hidden>
    <div id="call-ring" class="call-ring" hidden>
      <div class="call-ring-shell">
        <div class="call-ring-glow" aria-hidden="true"></div>
        <div class="call-ring-avatar-wrap">
          <div id="call-ring-avatar" class="call-ring-avatar">?</div>
        </div>
        <span id="call-ring-label" class="call-ring-label">Call</span>
        <h2 id="call-ring-name">Calling...</h2>
        <p id="call-ring-status">Ringing</p>
        <div class="call-ring-actions">
          <button id="call-reject" class="call-btn call-btn-reject" type="button" aria-label="Decline call">
            <span class="call-btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.89.33 1.76.62 2.59a2 2 0 0 1-.45 2.11L8 9.72a16 16 0 0 0 6.28 6.28l1.3-1.28a2 2 0 0 1 2.11-.45c.83.29 1.7.5 2.59.62A2 2 0 0 1 22 16.92Z"/><path d="m15 9 6-6"/><path d="m21 9-6-6"/></svg>
            </span>
            <span>Decline</span>
          </button>
          <button id="call-cancel" class="call-btn call-btn-reject" type="button" aria-label="Cancel call" hidden>
            <span class="call-btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.89.33 1.76.62 2.59a2 2 0 0 1-.45 2.11L8 9.72a16 16 0 0 0 6.28 6.28l1.3-1.28a2 2 0 0 1 2.11-.45c.83.29 1.7.5 2.59.62A2 2 0 0 1 22 16.92Z"/><path d="m15 9 6-6"/><path d="m21 9-6-6"/></svg>
            </span>
            <span>Cancel</span>
          </button>
          <button id="call-accept" class="call-btn call-btn-accept" type="button" aria-label="Accept call">
            <span class="call-btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.89.33 1.76.62 2.59a2 2 0 0 1-.45 2.11L8 9.72a16 16 0 0 0 6.28 6.28l1.3-1.28a2 2 0 0 1 2.11-.45c.83.29 1.7.5 2.59.62A2 2 0 0 1 22 16.92Z"/></svg>
            </span>
            <span>Accept</span>
          </button>
        </div>
      </div>
    </div>
    <div id="call-active" class="call-active" hidden>
      <div id="call-remotes" class="call-remotes"></div>
      <video id="call-local" class="call-local" autoplay playsinline muted hidden></video>
      <div class="call-active-meta">
        <strong id="call-title">Call</strong>
        <span id="call-status">Connecting…</span>
      </div>
      <div class="call-controls">
        <button id="call-mute" class="call-ctrl" type="button" aria-label="Mute">
          <span class="call-ctrl-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
          </span>
          <span>Mic</span>
        </button>
        <button id="call-camera" class="call-ctrl" type="button" aria-label="Camera">
          <span class="call-ctrl-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5 3V8l-5 3Z"/><rect x="3" y="6" width="13" height="12" rx="2"/></svg>
          </span>
          <span>Cam</span>
        </button>
        <button id="call-hangup" class="call-ctrl call-ctrl-end" type="button" aria-label="End call">
          <span class="call-ctrl-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.89.33 1.76.62 2.59a2 2 0 0 1-.45 2.11L8 9.72a16 16 0 0 0 6.28 6.28l1.3-1.28a2 2 0 0 1 2.11-.45c.83.29 1.7.5 2.59.62A2 2 0 0 1 22 16.92Z"/><path d="m15 9 6-6"/><path d="m21 9-6-6"/></svg>
          </span>
          <span>End</span>
        </button>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/scripts/http.js"></script>
  <script src="/scripts/call.js?v=layout"></script>
  <script src="/scripts/console.js?v=layout"></script>
  <script src="/scripts/chat.js?v=layout"></script>
</body>
</html>
