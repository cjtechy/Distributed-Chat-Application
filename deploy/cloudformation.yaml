AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Distributed Chat database tier (Postgres + Redis on EC2) and logic tier
  (FastAPI + Erlang + nginx). Frontend stays on AWS Amplify. Passwords are
  stack parameters — never commit them.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH (optional if you use SSM).
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet (both instances need outbound internet for apt/git).
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: ^\d+\.\d+\.\d+\.\d+/\d+$
  AllowedSshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to SSH. Tighten this.
  InstanceTypeDb:
    Type: String
    Default: t3.small
  InstanceTypeLogic:
    Type: String
    Default: t3.small
  RepoUrl:
    Type: String
    Default: https://github.com/cjtechy/Distributed-Chat-Application.git
  ApiDomain:
    Type: String
    Description: Public API hostname (e.g. api.example.com).
  WsDomain:
    Type: String
    Description: Public WebSocket hostname (e.g. ws.example.com).
  FrontendOrigin:
    Type: String
    Description: Amplify origin, no trailing slash (used in CORS_ORIGINS).
  CertbotEmail:
    Type: String
    Default: ""
    Description: Let's Encrypt email. Leave empty to skip TLS until DNS points here.
  SecretKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: JWT + Redis HMAC secret (32+ characters).
  PostgresPassword:
    Type: String
    NoEcho: true
    MinLength: 4
    Description: Password for Postgres user chatapp. Avoid quotes.
  RedisPassword:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Redis requirepass. Must match what the app uses as REDIS_PASSWORD.
  AdminUsername:
    Type: String
    Default: admin
  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 8
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-1/ami-id

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres and Redis from the logic instance only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LogicSecurityGroup
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref LogicSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-sg"

  LogicSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH, HTTP, HTTPS for the chat API and WebSocket proxy
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-logic-sg"

  DatabaseInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceTypeDb
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !Ref DbSecurityGroup
          SubnetId: !Ref SubnetId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/chat-db-userdata.log 2>&1
          export DEBIAN_FRONTEND=noninteractive
          POSTGRES_PASSWORD='${PostgresPassword}'
          REDIS_PASSWORD='${RedisPassword}'
          VPC_CIDR='${VpcCidr}'
          while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 2; done
          apt-get update
          apt-get install -y postgresql redis-server
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<SQL
          DO \$\$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'chatapp') THEN
              CREATE USER chatapp WITH PASSWORD '$POSTGRES_PASSWORD';
            ELSE
              ALTER USER chatapp WITH PASSWORD '$POSTGRES_PASSWORD';
            END IF;
          END
          \$\$;
          SELECT 'CREATE DATABASE chatapp OWNER chatapp'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'chatapp')\gexec
          SQL
          PG_CONF=$(find /etc/postgresql -name postgresql.conf | head -n1)
          HBA=$(find /etc/postgresql -name pg_hba.conf | head -n1)
          sed -i "s/^#\?listen_addresses.*/listen_addresses = '*'/" "$PG_CONF"
          grep -q "chatapp $VPC_CIDR" "$HBA" || echo "host chatapp chatapp $VPC_CIDR scram-sha-256" >> "$HBA"
          systemctl enable --now postgresql
          systemctl restart postgresql
          sed -i 's/^bind .*/bind 0.0.0.0/' /etc/redis/redis.conf
          sed -i 's/^protected-mode yes/protected-mode no/' /etc/redis/redis.conf
          if grep -q '^#\?requirepass ' /etc/redis/redis.conf; then
            sed -i "s/^#\?requirepass .*/requirepass $REDIS_PASSWORD/" /etc/redis/redis.conf
          else
            echo "requirepass $REDIS_PASSWORD" >> /etc/redis/redis.conf
          fi
          systemctl enable --now redis-server
          systemctl restart redis-server

  LogicInstance:
    Type: AWS::EC2::Instance
    DependsOn: DatabaseInstance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceTypeLogic
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !Ref LogicSecurityGroup
          SubnetId: !Ref SubnetId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-logic"
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            exec > /var/log/chat-logic-userdata.log 2>&1
            export DEBIAN_FRONTEND=noninteractive
            APP_DIR=/opt/chat
            DB_PRIVATE_IP='${DbPrivateIp}'
            API_DOMAIN='${ApiDomain}'
            WS_DOMAIN='${WsDomain}'
            FRONTEND_ORIGIN='${FrontendOrigin}'
            REPO_URL='${RepoUrl}'
            CERTBOT_EMAIL='${CertbotEmail}'
            SECRET_KEY='${SecretKey}'
            POSTGRES_PASSWORD='${PostgresPassword}'
            REDIS_PASSWORD='${RedisPassword}'
            ADMIN_USERNAME='${AdminUsername}'
            ADMIN_PASSWORD='${AdminPassword}'
            while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 2; done
            apt-get update
            apt-get install -y nginx certbot python3-certbot-nginx python3 python3-venv python3-pip git erlang erlang-dev rebar3 curl dnsutils
            rm -rf "$APP_DIR"
            git clone "$REPO_URL" "$APP_DIR"
            chown -R ubuntu:ubuntu "$APP_DIR"
            python3 -m venv "$APP_DIR/.venv"
            "$APP_DIR/.venv/bin/pip" install --upgrade pip
            "$APP_DIR/.venv/bin/pip" install -r "$APP_DIR/backend/requirements.txt"
            umask 077
            cat > "$APP_DIR/backend/.env" <<EOF
            HOST=127.0.0.1
            PORT=8000
            SECRET_KEY=$SECRET_KEY
            JWT_EXPIRE_HOURS=24
            COOKIE_SECURE=1
            CORS_ORIGINS=$FRONTEND_ORIGIN
            POSTGRES_HOST=$DB_PRIVATE_IP
            POSTGRES_PORT=5432
            POSTGRES_USER=chatapp
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=chatapp
            POSTGRES_POOL_MIN=2
            POSTGRES_POOL_MAX=20
            REDIS_HOST=$DB_PRIVATE_IP
            REDIS_PORT=6379
            REDIS_PASSWORD=$REDIS_PASSWORD
            REDIS_DB=0
            REDIS_CHAT_CHANNEL=chat:messages
            REDIS_INBOUND_CHANNEL=chat:inbound
            REDIS_ONLINE_KEY=chat:online_users
            REDIS_USERNAME_KEY=chat:usernames
            MAX_GROUP_USERS=1000
            ERLANG_WS_PORT=8080
            ADMIN_USERNAME=$ADMIN_USERNAME
            ADMIN_PASSWORD=$ADMIN_PASSWORD
            EOF
            chown ubuntu:ubuntu "$APP_DIR/backend/.env"
            cat > /etc/systemd/system/chat-api.service <<UNIT
            [Unit]
            Description=Distributed Chat FastAPI
            After=network.target
            [Service]
            WorkingDirectory=$APP_DIR/backend
            ExecStart=$APP_DIR/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
            Restart=always
            [Install]
            WantedBy=multi-user.target
            UNIT
            cat > "$APP_DIR/erlang-messaging/start-linux.sh" <<'START'
            #!/bin/bash
            set -euo pipefail
            cd "$(dirname "$0")"
            rebar3 compile
            EBINS=$(find _build/default/lib -type d -name ebin | tr '\n' ' ')
            exec erl -noshell -noinput -config config/sys.config -pa $EBINS \
              -eval 'application:ensure_all_started(chat_messaging).'
            START
            chmod +x "$APP_DIR/erlang-messaging/start-linux.sh"
            cat > /etc/systemd/system/chat-ws.service <<UNIT
            [Unit]
            Description=Distributed Chat Erlang
            After=network.target
            [Service]
            WorkingDirectory=$APP_DIR/erlang-messaging
            Environment=DOTENV_PATH=$APP_DIR/backend/.env
            Environment=HOME=/root
            ExecStart=$APP_DIR/erlang-messaging/start-linux.sh
            Restart=always
            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now chat-api chat-ws
            cat > /etc/sudoers.d/chat-deploy <<'SUDO'
            ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl restart chat-api, /bin/systemctl restart chat-ws, /bin/systemctl status chat-api, /bin/systemctl status chat-ws, /bin/systemctl is-active chat-api, /bin/systemctl is-active chat-ws
            SUDO
            chmod 440 /etc/sudoers.d/chat-deploy
            cat > /etc/nginx/sites-available/api <<NGX
            server {
                listen 80;
                server_name $API_DOMAIN;
                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
            NGX
            cat > /etc/nginx/sites-available/ws <<NGX
            server {
                listen 80;
                server_name $WS_DOMAIN;
                location / {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host \$host;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 86400;
                }
            }
            NGX
            ln -sf /etc/nginx/sites-available/api /etc/nginx/sites-enabled/api
            ln -sf /etc/nginx/sites-available/ws /etc/nginx/sites-enabled/ws
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx
            if [ -n "$CERTBOT_EMAIL" ]; then
              PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4 || true)
              for i in $(seq 1 40); do
                [ "$(dig +short "$API_DOMAIN" | tail -n1)" = "$PUBLIC_IP" ] && \
                [ "$(dig +short "$WS_DOMAIN" | tail -n1)" = "$PUBLIC_IP" ] && break
                sleep 15
              done
              certbot --nginx -d "$API_DOMAIN" -d "$WS_DOMAIN" \
                --non-interactive --agree-tos -m "$CERTBOT_EMAIL" --redirect || true
            fi
          - DbPrivateIp: !GetAtt DatabaseInstance.PrivateIp
            ApiDomain: !Ref ApiDomain
            WsDomain: !Ref WsDomain
            FrontendOrigin: !Ref FrontendOrigin
            RepoUrl: !Ref RepoUrl
            CertbotEmail: !Ref CertbotEmail
            SecretKey: !Ref SecretKey
            PostgresPassword: !Ref PostgresPassword
            RedisPassword: !Ref RedisPassword
            AdminUsername: !Ref AdminUsername
            AdminPassword: !Ref AdminPassword

  LogicEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-logic"

  LogicEipAssoc:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt LogicEip.AllocationId
      InstanceId: !Ref LogicInstance

Outputs:
  DatabasePrivateIp:
    Value: !GetAtt DatabaseInstance.PrivateIp
  LogicPublicIp:
    Value: !GetAtt LogicInstance.PublicIp
  LogicElasticIp:
    Value: !Ref LogicEip
  ApiHealth:
    Value: !Sub "http://${LogicEip}/v1/health"
  WsHealth:
    Value: !Sub "http://${LogicEip}/health"
  PointDnsAt:
    Description: Point ApiDomain and WsDomain A records here, then wait for certbot or rerun certbot on the logic host.
    Value: !Ref LogicEip
