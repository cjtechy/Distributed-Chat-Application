services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - chat-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp -d chatapp"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - docker/local.env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ws:
    build:
      context: .
      dockerfile: docker/erlang.Dockerfile
    env_file:
      - docker/local.env
    environment:
      DOTENV_PATH: /etc/chat.env
    volumes:
      - ./docker/local.env:/etc/chat.env:ro
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5500:80"
      - "80:80"
    depends_on:
      - api
      - ws

volumes:
  chat-pg:
